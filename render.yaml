services:
  - type: web
    name: nyc-floodguard-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://kdawtech.github.io
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "15"
      - key: GEMINI_MODEL
        value: gemini-4-hydrogen
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_TIMEOUT_MS
        value: "18000"
      - key: GEMINI_API_KEY
        sync: false
